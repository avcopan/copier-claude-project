_subdirectory: template

# .claude/skills is a symlink to ../.agents/skills (Claude Code only reads .claude/)
_preserve_symlinks: true

# These files belong to the project after the first copy, so updates never touch them
_skip_if_exists:
  - CLAUDE.md
  - repos.txt

_message_after_copy: |
  Your project has been created in {{ _copier_conf.dst_path }}.
  Next, initialize it (this runs pixi install, git init, the initial commit, and pixi run bootstrap,
  and prints the commands to push to GitHub):
    cd {{ _copier_conf.dst_path }}
    pixi run init
  Add your code repos to repos.txt, and run pixi run bootstrap again.

# questions
project_name:
  type: str
  help: Project name (the directory name in ~/proj/<project_name> and ~/code/<project_name>)
  validator: "{% if not project_name or project_name != project_name.lower() or not project_name.replace('-', '').replace('_', '').isalnum() or not project_name[0].isalpha() %}Use lowercase letters, digits, '-', and '_', starting with a letter{% endif %}"

github_org_name:
  type: str
  help: GitHub username or organization

description:
  type: str
  help: One-line project description (optional)
  default: ""
