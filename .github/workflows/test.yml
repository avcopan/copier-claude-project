name: test

on:
  push:
    branches: ["**"]  # all branches, but not tags (releases run this workflow themselves)
  pull_request:
  workflow_dispatch:
  workflow_call:  # allows the release workflow to run the checks first

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true

      - name: Run pre-commit hooks
        run: pixi run pre-commit
